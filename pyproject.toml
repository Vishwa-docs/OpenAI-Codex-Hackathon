[project]
name = "cloud-migration-cockpit"
version = "0.1.0"
description = "AI-native migration assessment and planning control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "pyyaml>=6.0,<7.0",
  "reportlab>=4.2,<5.0",
  "langgraph>=0.2,<1.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0"
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "services"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
